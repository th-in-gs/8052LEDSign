; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html
;
; Dump the 8052's internal mask ROM:
;   pio run -e mcs51 -t upload
; then capture the output with:
;   ~/.platformio/penv/bin/python scripts/capture_romdump.py
;
; Uploading the mcs51 environment builds the dumper, then builds and uploads
; the AVR host with the dumper compiled into it.

[platformio]
default_envs = mcs51
src_dir = .

# The internal mask ROM dumper, run by the 8052. Linked at 0x4000 so that it
# is always fetched from external memory, even after EA is raised.
[env:mcs51]
platform = intel_mcs51
board = Generic8051
board_build.f_cpu = 13875000L
board_build.size_code = 32768

build_src_filter = +<mcs51/src/>
custom_code_loc = 0x4000
extra_scripts =
    scripts/override_mcs51_upload.py
    scripts/mcs51_code_loc.py

upload_protocol = custom
monitor_speed = 38400

# The AVR host is a small program that compiles the MCS-51 binary into itself,
# loads it into the 8052's external RAM, runs it, then reads the dump back and
# prints it over serial. Requires the 8052's EA pin to be wired to AVR PD2.
[env:avr_host]
platform = atmelavr
board = ATmega328

# We're using the intermal 8MHz oscilator, no crystal.
board_build.f_cpu = 8000000L

# Make sure we get a newer avrdude, with support for the 'urclock' upload method
# used by the 'urboot' bootloader that is now the default set up by MiniCode
# (see the 'avr_host_bootloader' environment, below).
platform_packages =
	platformio/tool-avrdude@>=1.70000

upload_protocol = urclock
upload_speed = 250000
monitor_speed = 38400

build_flags =
    ${env.build_flags}
    -std=c++17

build_src_filter = +<avr_host/src/>
extra_scripts = pre:scripts/integrate_mcs51_firmware.py


[env:avr_host_bootloader]
extends = env:avr_host
framework = arduino
upload_speed = 19200

board_hardware.oscillator = internal
board_hardware.eesave = no

; Can't use a status LED unfortunately, because PORT B is connected to the
; 8051's data bus.
board_bootloader.led_pin = no-led

; Need an ISP programmer to write the bootloader.
upload_protocol = stk500v1
upload_port = /dev/cu.usbserial-212130
upload_flags =
    -e
    -P${UPLOAD_PORT}
    -b${UPLOAD_SPEED}
    -u
